[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seaweed"
version = "1.0.0"
description = "SEAWEED (SEAfloor WavelEt Extraction and Diagnostics): automated extraction and diagnostics of effective marine seismic wavelets"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "Giuseppe Brancatelli"},
    {name = "Martina Busetti"},
    {name = "Edy Forlin"},
    {name = "Riccardo Geletti"},
    {name = "Vincenzo Lipari"},
    {name = "Rogerio Pignelli"},
]
keywords = ["source signature", "wavelet extraction", "marine seismic",
            "water-bottom multiple", "archive data reprocessing"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# Lower bounds only: the versions the paper was computed with are listed in
# the README and recorded in tests/reference_env.txt.
dependencies = ["numpy", "scipy", "matplotlib", "segyio"]

[project.optional-dependencies]
# Needed by validation/ only: the synthetic matrices read YAML configurations
# and generate their data with Devito.
validation = ["pyyaml", "devito"]

[tool.setuptools]
packages = ["seaweed"]

# =============================================================================
#  SYNTHETIC MATRIX v2: the main grid and the secondary axes of the paper
#
#  1. n_shots is a recorded covariate, not an axis: on test lines, 20 against
#     60 shots and 0.47 against 7.38 km of span changed NCC by +0.003 and
#     +0.008, against 0.024-0.028 between realisations.
#  2. ZMAX scales with D, so that the sediment thickness does not shrink with
#     water depth and depth is not confused with contamination.
#  3. Contamination (depth of the first reflector below the seafloor) is an
#     explicit axis, crossed with D.
#  4. L_w is fixed at 200 ms.
#  5. R_wb is a covariate, reconstructed exactly from the seed (true_rwb.py).
#  6. The maximum offset is computed per line, x_max = (4 D^2 / (v L_w) - v L_w) / 2:
#     beyond it the direct arrival enters the window of the primary.
#  7. n_ch = 1 in the main grid, so that depth is not confused with the number
#     of usable channels; the channel count is a secondary axis, at the
#     reference cell where x_max allows up to 32 channels.
# =============================================================================

meta:
  project: "wavelet_extraction_bgo"
  version: 2
  v_water: 1500.0
  dt_ms: 2.0
  n_replicas: 20
  seed_base: 20260810
  n_shots: 20              # a covariate, not an axis (note 1)
  w_len_ms: 200.0          # fixed (note 4)

paths:
  # relative to the directory the drivers are run from
  out_root: "wavelet_matrix_v2"
  manifest: "manifest.jsonl"
  results: "results.jsonl"

# -----------------------------------------------------------------------------
# Reference cell
# -----------------------------------------------------------------------------
reference:
  geom: "g3000"            # near 125 m, 120 channels, 25 m
  D_m: 400.0
  fmax_hz: 60.0
  first_layer_m: 150.0     # first reflector below the seafloor -> 158 ms twt
  slope_deg: 0.0
  roughness_m: 0.0
  zmax_margin_m: 1600.0    # ZMAX = D + zmax_margin (note 2)
  snr_db: 30.0
  # Structural elements are off in the main grid: with fault, folds or lens
  # the first reflector lies at 246 +- 276 m instead of the 150 requested,
  # because the fault shift grows without limit along x.  Structures are
  # tested on the secondary axes.
  p_fault: 0.0
  p_folds: 0.0
  p_lens: 0.0
  n_ch: 1                  # fixed in the grid (note 7)

# -----------------------------------------------------------------------------
# MAIN GRID: water depth x contamination, crossed.
#
# Separation threshold m >= 1 with L_w = 200 ms at the near trace:
#     g1500 (near  50 m) -> D_min 173 m
#     g3000 (near 125 m) -> D_min 203 m
#     g4500 (near 150 m) -> D_min 212 m
# The depths are denser around that threshold.
# -----------------------------------------------------------------------------
grid:
  D_m:            [100.0, 140.0, 180.0, 220.0, 260.0, 350.0, 600.0, 1000.0]
  first_layer_m:  [80.0, 150.0, 300.0]      # -> 84, 158, 316 ms twt

# -----------------------------------------------------------------------------
# SECONDARY AXES, one at a time around the reference cell.
# -----------------------------------------------------------------------------
secondary_axes:
  fmax_hz:     [35.0, 45.0, 80.0]           # from a low-frequency source to a broadband airgun
  slope_deg:   [2.0, 5.0, 10.0]
  roughness_m: [5.0, 15.0]
  geom:        ["g1500", "g4500"]           # another near offset, another D_min
  p_folds:     [1.0]                        # folds
  p_fault:     [1.0]                        # fault (progressive shift)
  p_lens:      [1.0]                        # anomalous body
  # the channel count, at the reference cell (D = 400 m -> x_max 917 m -> up to
  # 32 channels), where it is not confused with depth
  n_ch:        [4, 16, 32]

# -----------------------------------------------------------------------------
# POST-HOC, on the same gathers.  The usable n_ch is capped by x_max(D, L_w).
# -----------------------------------------------------------------------------
posthoc:
  snr_db: [0.0, 10.0, 20.0, 30.0]
  # n_ch is fixed at 1 in the grid and is a secondary axis (note 7)

# -----------------------------------------------------------------------------
# Covariates recorded for the analysis (not axes)
# -----------------------------------------------------------------------------
covariates:
  - R_wb_true          # from true_rwb.py, reconstructed from the seed
  - n_layers
  - has_fault
  - has_lens
  - x_max_usable_m     # (4 D^2/(v L_w) - v L_w)/2
  - n_ch_used
  - first_refl_twt_ms
